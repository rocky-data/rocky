name: engine-weekly

# Expensive-but-advisory jobs that don't need to run on every PR.
# Coverage (tarpaulin), the security audit, the POC smoke suite and a
# Windows compile check run weekly on main and can be triggered manually
# for one-off checks.

on:
  schedule:
    - cron: '0 8 * * 1'   # Monday 08:00 UTC
  workflow_dispatch:

# Advisory jobs only read the repo; restrict the token to the minimum (CodeQL ql-for-actions).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: engine

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job used to rely on whatever Rust the runner image happened to
      # ship, so `cargo install` and the audit ran on an unpinned, silently
      # changing toolchain. Pin it like every other Rust job here.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
      - name: Install cargo-audit
        # Pin to a specific version + --locked so a regression in a newer
        # cargo-audit release can't silently change the weekly CI signal.
        # Bump deliberately alongside any MSRV or advisory-db change.
        # 0.21.1 could no longer parse newer advisory-db entries (the TOML
        # schema drifted under it); 0.22.x reads the current database.
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run cargo audit
        # Advisory ignores (with rationale) live in engine/.cargo/audit.toml,
        # which cargo-audit reads from this working directory.
        run: cargo audit

  windows-check:
    name: Windows compile check
    runs-on: windows-2022
    # Advisory, like every job here. `engine-release.yml` builds
    # `x86_64-pc-windows-msvc` only on an `engine-v*` tag, so before this job
    # the first Windows compile of a release happened AFTER the tag was
    # pushed. A `cfg(unix)`-only item that escapes its gate, a non-exhaustive
    # match missing the Windows arm, or a lockfile change touching a
    # Windows-only dependency edge all surfaced there, and the fix cost a new
    # version and a new tag. Grepping for `std::os::unix` catches the first of
    # those and neither of the others.
    #
    # `cargo check`, not `build`: it answers the same question without paying
    # DuckDB's C++ compile, which is what makes the release build slow.
    # Not a required check — promote it once its runtime and flake rate are
    # known. Runs natively because `ring` and `aws-lc-sys` build scripts want
    # the real MSVC toolchain, which is why a cross-check from macOS does not
    # work.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned like every other Rust job here: an unpinned `stable` let
          # the 1.98.0 release land mid-day (2026-08-20) and turn required
          # checks red with no code change. Bump deliberately.
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Restore only, matching the other weekly jobs: a cache written here
          # would sit unread for seven days while competing for the repo's
          # 10 GB budget against caches that every PR restores from.
          save-if: false
      - name: cargo check (x86_64-pc-windows-msvc)
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned: an unpinned `stable` let the 1.98.0 release land mid-day
          # (2026-08-20) and turn required checks red with no code change,
          # while cache-busting every Rust job at once. Bump deliberately.
          toolchain: 1.98.0
          # `cargo-llvm-cov` reads the raw profile data with the toolchain's
          # own `llvm-profdata` / `llvm-cov`, which ship in this component.
          # It would install the component itself on first run; asking for it
          # here keeps the dependency visible and resolved against the SAME
          # pinned toolchain.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Restore only. A weekly job's cache would sit unread for seven days
          # while competing for the repo's 10 GB budget against caches that
          # every PR restores from. Latency does not matter on a schedule.
          save-if: false
      # Headroom for the coverage build, which is the largest thing this
      # repository builds anywhere. Buys back roughly 25 GB.
      #
      # Under tarpaulin this was not enough and the job was red from
      # 2026-08-24: `-Clink-dead-code`, which tarpaulin forces and cannot be
      # talked out of, took the instrumented build to ~105 GB of a 145 GB
      # disk. The linker writes through `mmap`, so filling it faults rather
      # than returning ENOSPC — which is why six weeks of logs carry
      # `signal 7` and never `No space left`. #1638 replaced the engine
      # rather than the disk. The reclaim stays: it is cheap, and it is what
      # gives the numbers below something to be early warning about.
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo fallocate -l 4G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true
      # `apt-get update` exits non-zero when ANY configured source serves a
      # bad index, including the third-party ones the GitHub runner image
      # ships (Google Chrome, Microsoft). On 2026-09-09 Chrome's repo served
      # a stale `Packages.gz` and every engine job died here before
      # compiling a line. Neither cmake nor the cross toolchain comes from
      # those repos, so they are removed first — and cmake is usually
      # preinstalled, so the whole block is skipped.
      - name: Install cmake
        run: |
          command -v cmake >/dev/null 2>&1 && exit 0
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y cmake
      - name: Install cargo-llvm-cov
        # Pinned + --locked for the same reason as cargo-audit above.
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      # Kept permanently. Every failure since 2026-08-24 carried a bus error
      # and no word about the machine it happened on, and the cause turned
      # out to be the one thing these two numbers show immediately. Headroom
      # here is the early warning for the next time the build grows.
      - name: Machine state before coverage
        run: |
          df -h / /mnt /tmp || true
          free -m || true
      - name: Run coverage
        # Source-based instrumentation, not ptrace: no `-Clink-dead-code`,
        # no forced `-Cdebuginfo=2`, and the profile is honoured. That is
        # what removes every term in the disk blow-up above (#1638).
        #
        # No --all-targets, for the reason it never had one: that pulls in
        # the criterion benches, and `binary_startup` shells out to
        # `cargo run` on every iteration, contending on the target/ lock.
        # The default target set (lib + bins + tests) is what we want
        # coverage for anyway.
        #
        # The total is NOT comparable to the 2026-08-17 tarpaulin baseline
        # (run 32012139494): the denominator changes when dead code is no
        # longer linked in. Read the first green run as the new baseline.
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --cobertura \
            --output-path coverage/cobertura.xml
      - name: Coverage summary
        # The cobertura file goes to an artifact nobody opens unless they
        # are already looking. Print the number too, so the run itself says
        # what it measured. `report` re-renders the profile data the step
        # above already produced — it does not re-run the tests.
        run: cargo llvm-cov report --summary-only
      - name: Machine state after coverage
        # `always()` so a failing coverage step still reports. Note the
        # limit: when the disk fills hard enough the runner AGENT dies, and
        # then no step runs and no logs upload at all. A job that ends with
        # `Run coverage` having no conclusion and an empty log has lost its
        # runner — which the disk does cause here, but so do cancellation
        # and ordinary infrastructure loss. Check the job's annotations for
        # the agent's own error before concluding which.
        if: always()
        run: |
          df -h / /mnt /tmp || true
          free -m || true
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: engine/coverage/cobertura.xml

  poc-smoke:
    name: POC Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned: an unpinned `stable` let the 1.98.0 release land mid-day
          # (2026-08-20) and turn required checks red with no code change,
          # while cache-busting every Rust job at once. Bump deliberately.
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Restore only. A weekly job's cache would sit unread for seven days
          # while competing for the repo's 10 GB budget against caches that
          # every PR restores from. Latency does not matter on a schedule.
          save-if: false
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 4G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true
      # `apt-get update` exits non-zero when ANY configured source serves a
      # bad index, including the third-party ones the GitHub runner image
      # ships (Google Chrome, Microsoft). On 2026-09-09 Chrome's repo served
      # a stale `Packages.gz` and every engine job died here before
      # compiling a line. Neither cmake nor the cross toolchain comes from
      # those repos, so they are removed first — and cmake is usually
      # preinstalled, so the whole block is skipped.
      - name: Install cmake
        run: |
          command -v cmake >/dev/null 2>&1 && exit 0
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y cmake
      - name: Build rocky binary
        working-directory: engine
        run: cargo build --release
      - name: Add rocky binary to PATH
        run: echo "$GITHUB_WORKSPACE/engine/target/release" >> "$GITHUB_PATH"
      # The playground POC run.sh scripts shell out to the standalone `duckdb`
      # CLI to seed data and inspect Parquet companions. The runner doesn't
      # ship it, so without this step every DuckDB-seeding POC fails with
      # `duckdb: command not found`. The engine bundles DuckDB 1.5.5
      # (libduckdb-sys 1.10505.0 since #1251); the CLI stays pinned at 1.5.3
      # because a 1.5.3-seeded file is readable by the 1.5.5 engine and the
      # pair has passed the POC suite every week since. Bump deliberately —
      # an unpinned CLI would change the seed format under the suite.
      - name: Install DuckDB CLI
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.3/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/duckdb
          duckdb --version
      # The branch-approve POC (00-foundations/08) calls `rocky branch approve`,
      # which records the approver from `git config user.email` and errors out
      # if it's unset — and a fresh runner has no git identity. Set one (exactly
      # what the CLI's own error message instructs) so the gated-promotion POC
      # can sign its approval artifact.
      - name: Configure git identity for rocky branch approve
        run: |
          git config --global user.email "engine-weekly@rocky.invalid"
          git config --global user.name "rocky weekly CI"
      - name: Run POC smoke tests
        working-directory: ${{ github.workspace }}
        run: bash examples/playground/scripts/run-all-duckdb.sh

      # Parse-validate credential-gated POCs with mock env vars. Catches
      # parse-time breakage (invalid strategy variants, V032/V033 adapter
      # role mismatches, malformed [pipeline.*]) that run-all-duckdb.sh
      # misses because credential-gated POCs short-circuit on the missing
      # env var before `rocky validate` runs. Marked `continue-on-error`
      # until the V033 + materialized_view sweep PRs land — see PR body.
      - name: Parse-validate credential-gated POCs
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: bash examples/playground/scripts/run-all-parse-validate.sh

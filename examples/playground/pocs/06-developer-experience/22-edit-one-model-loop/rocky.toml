# 22-edit-one-model-loop — edit one model, rebuild only it and its downstream.

[adapter]
type = "duckdb"
path = "poc.duckdb"

[pipeline.demo]
type = "transformation"
models = "models/**"

[pipeline.demo.target.governance]
auto_create_schemas = true

[run]
# Turn the skip gate on for every `rocky run` in this project.
skip_unchanged = true
# Only incremental and microbatch models probe MAX(<timestamp>) on a raw table.
# These models are full_refresh, so they need the weaker COUNT(*) signal to
# prove the raw data did not change. Without it, the staging models never skip.
skip_rowcount_fallback = true

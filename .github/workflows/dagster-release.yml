name: dagster-release

# Publishes dagster-rocky to PyPI via OIDC and ensures a GitHub Release exists
# when a dagster-v* tag is pushed. Supports both workflows:
#   1. CI-only: push tag → this workflow creates the GH Release + publishes to PyPI
#   2. Local-first: scripts/release.sh creates the GH Release, push tag → CI publishes to PyPI
# The GitHub Release is created as a draft and published by the last step only,
# after the PyPI upload and the asset upload both succeed. A failed build or
# publish therefore leaves a draft, which the public release list omits, not
# an empty or partial public release. `ensure-release` accepts an existing
# draft (the scripts/release.sh path) and refuses a release that is already
# published: nothing here may attach to, or re-publish, a live release.

on:
  push:
    tags: ["dagster-v*"]

permissions:
  contents: write

defaults:
  run:
    working-directory: integrations/dagster

jobs:
  # Create the GitHub Release if it doesn't already exist (supports both
  # CI-only releases and the local scripts/release.sh workflow where the
  # release is created before the tag push).
  ensure-release:
    name: Ensure GitHub Release exists
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # `gh release view` finds a draft by its pending tag too, so a draft
          # made by scripts/release.sh is seen here. Any other failure falls
          # through to `create`, which fails on its own if the release exists.
          if is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG already exists and is published. Refusing to publish again on top of a live release. If scripts/release.sh --publish made it, this run has nothing left to do. Otherwise convert it back to a draft (gh release edit $TAG --repo $GITHUB_REPOSITORY --draft) or delete it, then re-run."
              exit 1
            fi
            echo "Release $TAG already exists as a draft (scripts/release.sh path); this run will publish it"
          else
            echo "Creating draft release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --draft \
              --latest=false \
              --title "$TAG"
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: ensure-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: integrations/dagster/dist/

      - name: Attach wheel and sdist to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Guard the glob so an empty dist/ (uv build silently produced no
          # artifacts) doesn't send the literal string `dist/*` to the
          # upload command.
          shopt -s nullglob
          artifacts=( dist/* )
          shopt -u nullglob
          if (( ${#artifacts[@]} == 0 )); then
            echo "ERROR: no artifacts found under dist/" >&2
            ls -la dist/ || true
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # Last on purpose: a failure in any step above leaves the release a
      # draft. `--latest=false` again here, because GitHub's API defaults
      # `make_latest` to true when a draft is published, and the engine
      # release owns the repo's "Latest" badge.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=false
          echo "Published ${GITHUB_REF_NAME}"

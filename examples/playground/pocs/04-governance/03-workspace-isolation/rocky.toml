[adapter.databricks_prod]
type = "databricks"
host = "${DATABRICKS_HOST}"
http_path = "${DATABRICKS_HTTP_PATH}"
token = "${DATABRICKS_TOKEN}"

# Discovery adapter — Databricks is data-only, so the source tables are
# listed inline on a manual discovery adapter. It discovers exactly the
# schemas listed below, matched against `schema_pattern.prefix`; the POC
# exercises target-side workspace isolation, so one source table is enough.
# `--filter source=orders` selects the `raw__orders` schema.
[adapter.local_discovery]
type = "manual"
kind = "discovery"

[[adapter.local_discovery.schemas]]
name = "raw__orders"
tables = ["orders"]

[pipeline.poc]
strategy = "full_refresh"

[pipeline.poc.source]
adapter = "databricks_prod"
catalog = "main"

[pipeline.poc.source.discovery]
adapter = "local_discovery"

[pipeline.poc.source.schema_pattern]
prefix = "raw__"
separator = "__"
components = ["source"]

[pipeline.poc.target]
adapter = "databricks_prod"
catalog_template = "isolated_demo"
schema_template = "staging__{source}"

[pipeline.poc.target.governance]
auto_create_catalogs = true
auto_create_schemas = true

[pipeline.poc.target.governance.isolation]
enabled = true
[[pipeline.poc.target.governance.isolation.workspace_ids]]
id = 1234567890123456
binding_type = "READ_WRITE"

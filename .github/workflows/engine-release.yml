name: engine-release

# Full cross-platform release matrix. Builds binaries for all supported
# platforms and attaches them to the GitHub Release created by the tag push.
#
# The release is published atomically: `ensure-release` creates it as a
# **draft**, the matrix and `checksums` attach every artifact, and only then
# does `publish` flip it to a published release. This matters because
# `engine/install.sh` resolves "latest" by listing `/releases` (unauthenticated)
# and taking the highest `engine-v*` tag. Draft releases are omitted from that
# listing, so the new version becomes resolvable only once its binaries exist.
# Creating the release up front (as this workflow used to) made the tag
# resolvable for the ~15-25 min the matrix was still building, so any
# concurrent `install.sh` — a user's, or another PR's smoke job — resolved
# `engine-v<new>` and 404'd on the not-yet-uploaded archive.
#
# scripts/release.sh remains as a local-build hotfix fallback.

on:
  push:
    tags: ["engine-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Limit parallelism — DuckDB C++ compilation is extremely memory-intensive
  # and OOMs the GitHub Actions runner (~7GB RAM) at default parallelism
  CARGO_BUILD_JOBS: 4

defaults:
  run:
    working-directory: engine

jobs:
  build:
    name: Build ${{ matrix.target }}
    needs: [ensure-release, ui]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: rocky-aarch64-apple-darwin.tar.gz
            lsp_archive: rocky-lsp-aarch64-apple-darwin.tar.gz
            ext: tar.gz

          - runner: macos-14
            target: x86_64-apple-darwin
            archive: rocky-x86_64-apple-darwin.tar.gz
            lsp_archive: rocky-lsp-x86_64-apple-darwin.tar.gz
            ext: tar.gz

          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: rocky-x86_64-unknown-linux-gnu.tar.gz
            lsp_archive: rocky-lsp-x86_64-unknown-linux-gnu.tar.gz
            ext: tar.gz
            zigbuild: true

          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            archive: rocky-aarch64-unknown-linux-gnu.tar.gz
            lsp_archive: rocky-lsp-aarch64-unknown-linux-gnu.tar.gz
            ext: tar.gz
            zigbuild: true
            cross: true

          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: rocky-x86_64-pc-windows-msvc.zip
            lsp_archive: rocky-lsp-x86_64-pc-windows-msvc.zip
            ext: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned so a Rust release cannot silently change what a retagged
          # build produces. This removes ONE source of drift — the runner
          # image alias and unnormalized archive timestamps remain, so this
          # is not bit-for-bit reproducibility.
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Restore only. This workflow runs on a TAG ref, and GitHub scopes
          # caches so an entry created for one tag is never visible to the
          # next one — saving here spends multi-GB of the repo's 10 GB budget
          # on an entry only a re-run of this same tag could ever read, while
          # evicting the main-branch caches that every PR restores from.
          save-if: false
          key: release-${{ matrix.target }}

      # Windows: install NASM. `aws-lc-sys` (transitive dep of `jsonwebtoken`
      # via the `aws_lc_rs` feature flag enabled in the workspace toml)
      # builds AWS-LC's optimized crypto kernels from `.asm` sources on
      # Windows and panics with "NASM command not found" without it. The
      # macOS / Linux toolchains fall back to a YASM-equivalent assembler
      # that ships with the runner image.
      - name: Install NASM (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      # Linux: free disk space and add swap (DuckDB C++ is memory-hungry)
      - name: Free disk space and add swap
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 4G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true

      # Linux: install zig + cargo-zigbuild for portable glibc builds
      - name: Install zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        # Prebuilt binary — avoids ~35s of `cargo install cargo-zigbuild
        # --locked` (compiles from source) per Linux target.
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-zigbuild

      # Linux cross-compile: install the cross-compilation toolchain
      - name: Install cross-compilation toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # The browser UI, built once by the `ui` job below, embedded into
      # every target with `--features ui`.
      - name: Fetch the browser UI build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocky-ui-dist
          path: engine/ui/dist

      # Linux: build with cargo-zigbuild (portable glibc). Build both
      # binaries in the same invocation so the workspace compile cache
      # is shared and we don't pay rocky-core / rocky-compiler twice.
      - name: Build release binaries (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --bin rocky --bin rocky-lsp --features ui --target ${{ matrix.target }}

      # macOS / Windows: build with plain cargo
      - name: Build release binaries (cargo)
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --bin rocky --bin rocky-lsp --features ui --target ${{ matrix.target }}

      # Unix: package each binary as its own .tar.gz. Split archives so
      # consumers who only need the LSP don't download the full CLI.
      - name: Package binaries (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release rocky
          tar czf ${{ matrix.lsp_archive }} -C target/${{ matrix.target }}/release rocky-lsp

      # Windows: same split, as .zip
      - name: Package binaries (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/rocky.exe -DestinationPath ${{ matrix.archive }}
          Compress-Archive -Path target/${{ matrix.target }}/release/rocky-lsp.exe -DestinationPath ${{ matrix.lsp_archive }}

      # Upload with `gh` rather than a release action: `gh release upload`
      # touches assets only, so it cannot disturb the draft state that
      # `publish` is responsible for clearing. (A release action that PATCHes
      # the release would publish it early and reintroduce the race this
      # workflow exists to avoid.) Same mechanism the `checksums` job uses.
      # `shell: bash` so the windows-2022 runner doesn't run this under pwsh;
      # paths are relative to the workflow-level `working-directory: engine`,
      # which is where the packaging steps above wrote the archives.
      - name: Attach to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ matrix.archive }}" \
            "${{ matrix.lsp_archive }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  # Generate checksums.txt from all platform archives and attach to the release.
  # Runs after all build jobs so every archive is present before hashing.
  checksums:
    name: Generate checksums
    needs: [ensure-release, build]
    runs-on: ubuntu-24.04
    # Override the workflow-level `working-directory: engine` — this job
    # operates at the repo root and needs no Cargo workspace.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "rocky-*.tar.gz" \
            --pattern "rocky-*.zip" \
            --dir release-artifacts

      - name: Generate checksums.txt
        run: |
          cd release-artifacts
          # Require that at least one of each expected archive glob was
          # actually downloaded — otherwise `sha256sum rocky-*.tar.gz` would
          # happily write an empty checksums.txt (or a line for the literal
          # glob string) and we'd publish unverifiable artifacts.
          shopt -s nullglob
          targz=( rocky-*.tar.gz )
          zips=( rocky-*.zip )
          shopt -u nullglob
          if (( ${#targz[@]} == 0 || ${#zips[@]} == 0 )); then
            echo "ERROR: expected at least one rocky-*.tar.gz and one rocky-*.zip in release-artifacts/" >&2
            ls -la
            exit 1
          fi
          sha256sum "${targz[@]}" "${zips[@]}" > checksums.txt
          cat checksums.txt

      - name: Upload checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release-artifacts/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  # Publish one container image per release to GHCR, from the two Linux
  # archives the matrix attached. Nothing is compiled here, so the image is the
  # release, bit for bit (engine/Dockerfile). Ordered after `build` and before
  # `publish`, so a release never goes live without its image — the same
  # fail-closed rule as `checksums`: an image failure leaves the draft
  # unpublished, and a re-run of this job publishes it.
  #
  # Tags: `<version>` from the `engine-v<version>` tag, `<major>.<minor>`, and
  # `latest`. A pre-release version (anything with a `-`, such as
  # `1.74.0-rc.1`) gets only its own tag and never moves `latest` or
  # `<major>.<minor>`. A tag is never rebuilt in place: a base-image bump ships
  # as a new patch release.
  #
  # `permissions` here replaces the workflow-level block for this job:
  # `contents: write` is what every job in this file uses to read the draft's
  # assets, `packages: write` is the push. No other job can reach GHCR.
  image:
    name: Publish container image
    needs: [ensure-release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    # Override the workflow-level `working-directory: engine` — this job
    # operates at the repo root and needs no Cargo workspace.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/rocky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "rocky-x86_64-unknown-linux-gnu.tar.gz" \
            --pattern "rocky-aarch64-unknown-linux-gnu.tar.gz" \
            --dir release-archives

      # The build context is only the two binaries, laid out the way
      # engine/Dockerfile expects (`<context>/<TARGETARCH>/rocky`), so the
      # image build sees nothing else in the checkout.
      - name: Lay out the build context
        run: |
          mkdir -p image-context/amd64 image-context/arm64
          tar xzf release-archives/rocky-x86_64-unknown-linux-gnu.tar.gz -C image-context/amd64
          tar xzf release-archives/rocky-aarch64-unknown-linux-gnu.tar.gz -C image-context/arm64
          test -x image-context/amd64/rocky
          test -x image-context/arm64/rocky

      # The version and the tag list derive from the git tag here, so the
      # image needs no third-party tag-parsing action.
      - name: Derive the image tags
        id: tags
        run: |
          VERSION="${GITHUB_REF_NAME#engine-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not start with engine-v"
            exit 1
          fi
          TAGS="${IMAGE}:${VERSION}"
          case "$VERSION" in
            *-*)
              echo "Pre-release ${VERSION}: its own tag only"
              ;;
            *)
              MAJOR_MINOR="${VERSION%.*}"
              TAGS="${TAGS},${IMAGE}:${MAJOR_MINOR},${IMAGE}:latest"
              ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAGS}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms from one build: the Dockerfile has no RUN step, so the
      # foreign-architecture layer needs no emulation. BuildKit attaches an
      # SBOM and max-detail provenance to the pushed index.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: image-context
          file: engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=rocky
            org.opencontainers.image.description=The Rocky engine: the rocky CLI, rocky serve and the browser UI
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          # The SBOM generator is itself an image BuildKit pulls at build
          # time; pinned by digest like every other release source, so a
          # moved `:1` tag cannot change what attests the release.
          sbom: generator=docker/buildkit-syft-scanner:1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      # Pull what was pushed and run it once: the version it prints must be
      # the release's. A wrong binary in an archive, or a wrong tag, fails here
      # and keeps the release a draft.
      # Two checks, because a runner can execute only its own architecture.
      # The amd64 image is RUN: a wrong binary in an archive, or a wrong tag,
      # fails here and keeps the release a draft. The arm64 image cannot be
      # run without emulation (one more trust root for one `--version`), so it
      # is inspected instead: the manifest list must name both platforms, so a
      # half-pushed index is caught even though its arm64 binary is unexecuted.
      # The first user to run it on arm64 is the first to execute that binary,
      # and the guide says to check `--version` against the release.
      - name: Smoke the pushed image (amd64, executed)
        run: |
          docker run --rm "${IMAGE}:${{ steps.tags.outputs.version }}" --version | tee version.txt
          grep -Fx "rocky ${{ steps.tags.outputs.version }}" version.txt

      - name: Check the manifest list names both platforms
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.version }}" | tee manifest.txt
          grep -q "linux/amd64" manifest.txt
          grep -q "linux/arm64" manifest.txt

  # Publish the draft, making the version resolvable by engine/install.sh.
  # Depends on `checksums` as well as `build` so checksums.txt is in place
  # before anyone can resolve the release — install.sh fetches it to verify
  # the download. Depends on `image` so the image exists before the version
  # is resolvable at all.
  #
  # `--latest` here rather than at creation: the engine binary owns the repo's
  # "Latest" badge, and asserting it at publish time also settles the ordering
  # when a coupled release pushes engine/sdk/dagster/vscode tags together.
  #
  # Fail-closed by design: if any platform build or the checksums job fails,
  # this job is skipped and the release stays an unpublished draft rather than
  # going live half-populated. That leftover draft is the intended outcome, not
  # a bug — re-run the failed jobs and this publishes it.
  publish:
    name: Publish release
    needs: [ensure-release, build, checksums, image]
    runs-on: ubuntu-24.04
    # Override the workflow-level `working-directory: engine` — this job needs
    # no checkout, so that directory does not exist here.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
          echo "Published ${GITHUB_REF_NAME}"

  # Create the GitHub Release if it doesn't already exist (supports both
  # CI-only releases and the local scripts/release.sh workflow, which creates
  # the release itself, as a draft, around the tag push).
  #
  # Created as a draft so it stays out of the public `/releases` listing until
  # `publish` runs — see the header comment. An existing draft (the
  # scripts/release.sh path) is used as it is: the matrix overwrites its
  # archives and `publish` flips it. An existing release that is already
  # published stops the run instead. Attaching to it would put the build
  # window, and any failed target, on a release the public can already
  # resolve. Converting it back to a draft here would retract a live release
  # on every full re-run of this workflow, and leave it retracted if that
  # re-run fails. Refusing changes nothing and names the fix.
  ensure-release:
    name: Ensure GitHub Release exists
    runs-on: ubuntu-24.04
    # Run before build so artifacts have a release to attach to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # `gh release view` finds a draft by its pending tag too (it falls
          # back to the release list when /releases/tags/<tag> is a 404), so a
          # draft made by scripts/release.sh is seen here. Any other failure
          # falls through to `create`, which fails on its own if the release
          # exists after all.
          if is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG already exists and is published. Refusing to attach a new build to a live release. Convert it back to a draft (gh release edit $TAG --repo $GITHUB_REPOSITORY --draft) or delete it, then re-run."
              exit 1
            fi
            echo "Release $TAG already exists as a draft (scripts/release.sh path); the matrix will attach to it"
          else
            echo "Creating draft release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --draft \
              --title "$TAG"
          fi

  # The browser UI `rocky serve --ui` embeds, built once before the matrix.
  # The first node toolchain in an engine release: every target downloads
  # this one `dist/` and embeds it with `--features ui`.
  ui:
    name: Build the browser UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/ui/package-lock.json
      - run: npm ci
      - run: npm test
      # `npm run build` also refuses a bundle that loads from another host.
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocky-ui-dist
          path: engine/ui/dist
          if-no-files-found: error

name: engine-evals

# Pull-request validation is intentionally credential-free. The workflow
# runs under the ordinary pull-request event, with no environment or secret
# references. Live model calls run only in engine-evals-live.yml on main.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'engine/evals/**'
      - 'engine/crates/rocky-mcp/**'
      - '.github/workflows/engine-evals.yml'

permissions:
  contents: read

concurrency:
  group: engine-evals-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval-contract:
    name: Agent eval harness and error contract (credential-free)
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned: an unpinned `stable` let the 1.98.0 release land mid-day
          # (2026-08-20) and turn required checks red with no code change,
          # while cache-busting every Rust job at once. Bump deliberately.
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Restore only. This workflow runs on pull_request refs, whose caches
          # are visible to that PR alone and are deleted when it closes. Saving
          # here only consumes the shared 10 GB budget and evicts main's
          # entries; restoring from main still gives the warm dependency tree.
          save-if: false
          key: evals-pr

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Configure swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build rocky (debug)
        working-directory: engine
        run: cargo build --bin rocky

      - name: Harness self-test
        working-directory: engine/evals
        run: uv run python run_evals.py --selftest

      - name: Structured-error contract
        working-directory: engine/evals
        env:
          ROCKY_BIN: ${{ github.workspace }}/engine/target/debug/rocky
        run: uv run python run_evals.py --error-contract

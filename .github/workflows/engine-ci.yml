name: engine-ci

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'schemas/**'
      # Compiled INTO the binary: rocky-mcp `include_str!`s this skill as the
      # MCP `instructions` (crates/rocky-mcp/src/tools.rs). Editing it changes
      # what `rocky mcp` serves, and renaming or deleting it fails the build —
      # so it needs engine CI, and without it the five required contexts never
      # run and the PR cannot merge at all (#1557).
      - '.claude/skills/rocky-ai-workflow/SKILL.md'
      - '.github/workflows/engine-ci.yml'
  # No `paths:` filter on pull_request — deliberately. Four required merge
  # contexts live in this workflow (Test, Clippy, Format, Adapter boundary).
  # A workflow-level path filter leaves those contexts ABSENT on a PR that
  # does not match, and an absent required check blocks the merge forever
  # (#1563). Instead the `changes` job below detects whether engine paths
  # were touched, and each job skips itself — a job skipped by an `if:`
  # conditional still reports, and satisfies the required check.
  pull_request:
    branches: [main]

# CI only reads the repo; restrict the token to the minimum (CodeQL ql-for-actions).
permissions:
  contents: read

# Cancel superseded in-progress runs on the same PR — a new push supersedes the
# previous run instead of letting both finish. Scoped to pull_request so a
# fast-follow merge to main never cancels a main-branch validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Limit parallelism — DuckDB C++ compilation is extremely memory-intensive
  # and OOMs the GitHub Actions runner (~7GB RAM) at default parallelism
  CARGO_BUILD_JOBS: 4
  # Survive transient crates.io download flakes on GitHub runners (seen as
  # "[16] Error in the HTTP2 framing layer" mid-fetch): retry the download and
  # force HTTP/1.1, which sidesteps the intermittent HTTP/2 framing bug.
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'

defaults:
  run:
    working-directory: engine

jobs:
  # Computes whether this PR touches any path engine CI cares about. The list
  # below must stay in sync with the `push` trigger's `paths:` above. On any
  # other event the trigger's own filter already matched, so the `trigger`
  # step answers yes without a checkout — a push to main pays nothing here
  # beyond the runner spin-up.
  #
  # Fail closed: the answer is "false" only when the diff was computed AND
  # grep itself reported a clean non-match (exit 1). A failed diff or a grep
  # error still writes "true". A step that never ran writes nothing, so the
  # job output is empty; the gates below test `!= 'false'`, and an empty
  # answer runs the full suite.
  changes:
    name: Detect engine changes
    runs-on: ubuntu-latest
    outputs:
      # Exactly one of the two steps runs per event; a skipped step's output
      # is empty, and `||` picks the one that wrote.
      engine: ${{ steps.diff.outputs.engine || steps.trigger.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The PR merge commit plus both of its parents.
          fetch-depth: 2
      - name: Diff the merge commit against its base parent
        id: diff
        if: github.event_name == 'pull_request'
        env:
          # Mirrors the push trigger paths: engine/**, schemas/**, the skill
          # compiled into the binary (#1557), and this workflow itself.
          ENGINE_PATHS_RE: ^(engine/|schemas/|\.claude/skills/rocky-ai-workflow/SKILL\.md$|\.github/workflows/engine-ci\.yml$)
        run: |
          set -uo pipefail
          engine=true
          files=$(mktemp)
          # --no-renames: a rename lists BOTH its old and its new path. Plain
          # `git diff` folds a rename into the destination alone, so a file
          # renamed out of engine/ never matched and the suite skipped.
          # -z: NUL-terminated paths, and no quoting. Without it git QUOTES a
          # pathname holding an unusual byte, so a file named with a newline
          # in it lists as `"engine/...` — the leading double quote defeats
          # the `^` anchor and a real engine change read as no-match.
          if git diff --no-renames --name-only -z HEAD^1 HEAD > "$files"; then
            # grep reads a file, not a pipe. `printf | grep -q` let grep quit
            # on the first match while printf was still writing; past the
            # pipe buffer printf died of SIGPIPE, pipefail made the pipeline
            # non-zero, and a real match read as "false". Branch on grep's
            # own exit code instead: only a clean 1 means no match. `-z` here
            # matches the `-z` above: one record per NUL, so `^` and `$` still
            # anchor per path.
            status=0
            grep -zqE "$ENGINE_PATHS_RE" "$files" || status=$?
            case "$status" in
              0) engine=true ;;
              1) engine=false ;;
              *) echo "::warning::grep exited $status while matching the changed paths; running engine CI to fail closed" ;;
            esac
          else
            echo "::warning::could not diff the merge commit; running engine CI to fail closed"
          fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "engine=$engine"
      - name: Trust the trigger's own paths filter
        id: trigger
        if: github.event_name != 'pull_request'
        # Nothing is checked out on this path, so the workflow-level
        # `working-directory: engine` does not exist yet; run at the root.
        working-directory: .
        run: |
          echo "engine=true" >> "$GITHUB_OUTPUT"
          echo "engine=true"

  test:
    name: Test
    needs: changes
    # Skip only on a positive "false" from the detection job. An empty output
    # (the detection job itself failed) runs the suite — fail closed.
    if: ${{ !cancelled() && needs.changes.outputs.engine != 'false' }}
    runs-on: ubuntu-latest
    # CI-only: emit `line-tables-only` debuginfo on the dev+test profiles
    # instead of full debuginfo. Linking the workspace's test binaries with
    # full debuginfo dominated the build half of this job; line tables keep
    # file:line in panic backtraces while cutting codegen + link time. Both
    # profiles are needed — `cargo test` builds deps under `dev` but the
    # crates-under-test + harnesses (the part that rebuilds every run) under
    # `test`. Does not affect the `--release` jobs.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned: the unpinned `stable` default let the 1.98.0 release land
          # mid-day (2026-08-20) and turn Clippy red with no code change.
          # Bump this version deliberately, running clippy first.
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Save only from main. The cache is immutable per key, so a PR that
          # matches main's key never re-saves anyway; a PR that MISSES it (a
          # lockfile or toolchain change) used to mint its own multi-GB copy
          # under refs/pull/N/merge. Those duplicates pushed the repo past
          # GitHub's 10 GB cache budget and triggered LRU eviction of main's
          # entries — which is what turns a warm 11-minute run into a cold
          # 35-minute one. PRs still RESTORE from main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 4G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: nextest
      # nextest runs all test binaries in one global scheduler instead of
      # serially per-binary like `cargo test`, which is the win on a suite
      # this wide. It builds lib + bin + integration tests (no benches /
      # examples — those carry no `#[test]` and are still type-checked by the
      # clippy job's `--all-targets`). Like the prior `cargo test --all-targets`
      # it does not run doctests; the workspace has none.
      - name: Run tests (nextest)
        # --no-fail-fast: one flake used to cancel the remaining ~5000 tests,
        # so a red run reported a single failure and hid every unrelated one
        # behind "N tests were not run due to test failure" (#1405). Retries
        # are deliberately NOT added — they would bury a real intermittent
        # hang, which is the defect #1405 exists to keep visible.
        run: cargo nextest run --all-features --no-fail-fast

  clippy:
    name: Clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.engine != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Save only from main. The cache is immutable per key, so a PR that
          # matches main's key never re-saves anyway; a PR that MISSES it (a
          # lockfile or toolchain change) used to mint its own multi-GB copy
          # under refs/pull/N/merge. Those duplicates pushed the repo past
          # GitHub's 10 GB cache budget and triggered LRU eviction of main's
          # entries — which is what turns a warm 11-minute run into a cold
          # 35-minute one. PRs still RESTORE from main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 4G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.engine != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt -- --check

  adapter-boundary:
    name: Adapter boundary
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.engine != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check CLI adapter boundary
        run: bash ../scripts/lint-adapter-boundary.sh

  # Regression guard for the `valkey` Cargo feature on rocky-fivetran +
  # rocky-cache. The release workflow builds with default features only, so
  # `cargo test --all-features` above can't catch a dropped dep-edge flag —
  # workspace-level --all-features force-enables every feature regardless of
  # how rocky-cli wires its deps. This job mirrors the exact release-build
  # invocation and then exercises the tiered cache backend via `rocky doctor`,
  # which fails-loud if the feature isn't compiled in.
  #
  # Root cause when this guard was added: v1.39.0 linux release shipped
  # without `--features valkey`, every EKS code-server cold-started with
  # `failed to build [adapter.fivetran.cache] backend` (gold-dev 2026-05-20).
  release-build-smoke:
    name: Release-build smoke (valkey feature)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.engine != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned: the unpinned `stable` default let the 1.98.0 release land
          # mid-day (2026-08-20) and turn Clippy red with no code change.
          # Bump this version deliberately, running clippy first.
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Save only from main. The cache is immutable per key, so a PR that
          # matches main's key never re-saves anyway; a PR that MISSES it (a
          # lockfile or toolchain change) used to mint its own multi-GB copy
          # under refs/pull/N/merge. Those duplicates pushed the repo past
          # GitHub's 10 GB cache budget and triggered LRU eviction of main's
          # entries — which is what turns a warm 11-minute run into a cold
          # 35-minute one. PRs still RESTORE from main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 4G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true
      - run: sudo apt-get update && sudo apt-get install -y cmake
      # Mirror engine-release.yml exactly: default features only, no --features flags.
      - name: Build rocky with release flags
        run: cargo build --release --bin rocky
      - name: Doctor must build tiered cache backend
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cat > "$tmp/rocky.toml" <<'TOML'
          [adapter.test_databricks]
          type = "databricks"
          host = "x"
          http_path = "x"
          token = "x"

          [adapter.test_fivetran]
          type = "fivetran"
          kind = "discovery"
          destination_id = "x"
          api_key = "x"
          api_secret = "x"

          [adapter.test_fivetran.cache]
          backend = "tiered"
          file_root = "/tmp/rocky-cache-smoke"
          object_store_url = "s3://test-bucket/cache/"
          valkey_url = "rediss://localhost:6379"
          TOML
          out=$(./target/release/rocky --config "$tmp/rocky.toml" --state-path "$tmp/state.redb" --output json doctor --check auth 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q "failed to build \[adapter.test_fivetran.cache\] backend"; then
            echo "::error::valkey feature is missing from the shipped binary. Check engine/crates/rocky-cli/Cargo.toml for features=[\"valkey\"] on rocky-fivetran and rocky-cache."
            exit 1
          fi

  # Coverage and audit moved to engine-weekly.yml to reduce per-PR cost.

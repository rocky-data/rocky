[strategy]
type = "full_refresh"

[target]
schema = "staging"

# Per-model freshness SLA. `warn_after` is the age after which the model is stale
# (warning severity; `error_after` is the error level). Declaring it satisfies the W005
# coverage check for this model, independent of any project-level default.
[freshness]
warn_after = "1h"
time_column = "shipped_at"

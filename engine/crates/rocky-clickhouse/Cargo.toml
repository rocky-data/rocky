[package]
name = "rocky-clickhouse"
version = "1.77.0"
description = "ClickHouse warehouse adapter for Rocky (beta)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rocky-core = { path = "../rocky-core" }
rocky-ir = { path = "../rocky-ir" }
rocky-sql = { path = "../rocky-sql" }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# `test-support` exposes `MetadataColumn::new_unchecked`, which the dialect
# tests use to build the hostile metadata columns `select_clause` must refuse.
rocky-ir = { path = "../rocky-ir", features = ["test-support"] }
tokio = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true

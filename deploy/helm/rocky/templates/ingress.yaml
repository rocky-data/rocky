{{- include "rocky.guards" . }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rocky.fullname" . }}
  labels:
    {{- include "rocky.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # This host is also passed to the server as --allowed-host. A request that
    # reaches the server carrying any other Host is refused 421.
    #
    # A request carrying a foreign Host usually never gets that far: it matches
    # no Ingress rule, so the controller's own default backend answers 404.
    # That 404 is the controller's, not Rocky's. Assert the 421 through a
    # port-forward straight at the Service.
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "rocky.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}

{{- include "rocky.guards" . }}
{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rocky.fullname" . }}
  labels:
    {{- include "rocky.labels" . | nindent 4 }}
  annotations:
    # The project outlives the release. Deleting the release must not delete
    # the run history, the watermarks and the scheduler's cursors.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}

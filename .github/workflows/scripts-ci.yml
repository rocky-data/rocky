# CI for the operational scripts under scripts/ — most importantly the soak
# harness's verdict logic, whose ~45 self-test assertions otherwise run only
# when a human remembers to type `just soak-verdict-selftest` (#1311). A silent
# regression there is discovered 24 hours into the next soak, which is the most
# expensive possible place to find it.
name: Scripts CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"
      # The change-detector self-test replays these two workflows' own `run:`
      # blocks. Without them here, a PR that edits only a detector block runs
      # engine-ci and codegen-drift but not the test that guards them — the
      # guard absent for exactly the change that needs it (#1557, #1563).
      - ".github/workflows/engine-ci.yml"
      - ".github/workflows/codegen-drift.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"
      - ".github/workflows/engine-ci.yml"
      - ".github/workflows/codegen-drift.yml"

permissions:
  contents: read

jobs:
  soak-verdict-selftest:
    name: Soak-verdict self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the verdict self-test
        run: python3 scripts/soak_verdict.py --self-test

  mutation-check-verdicts:
    name: Mutation-check verdicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the killed / survived / inconclusive verdicts
        # Uses stub commands in scratch repos, so no Rust toolchain is needed.
        run: bash scripts/tests/mutation-check.test.sh

  ci-change-detector:
    name: CI change detector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Replay the detector blocks against scratch repos
        # Extracts each workflow's own `run:` block and replays it, so no
        # toolchain and no second copy of the logic are needed. This is also
        # where the fix runs under the runner's GNU grep rather than a
        # developer's.
        run: bash scripts/tests/ci-change-detector.test.sh

  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck the soak harness (full severity)
        # The scripts this workflow exists to protect hold the full bar and
        # already meet it.
        run: shellcheck scripts/soak-scheduler.sh scripts/tests/ci-change-detector.test.sh
      - name: Shellcheck everything else (error severity)
        # Six pre-existing scripts carry SC2155/SC2012/SC2015 warnings today
        # (release.sh, the vendor_* pair, regen_fixtures.sh, build_rocky_linux.sh).
        # Cleaning those is a separate, deliberate change — release tooling is
        # not drive-by territory — so the fleet-wide gate starts at error
        # severity: real breakage fails, the known warnings do not. Tighten to
        # full severity once they are cleaned.
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -type f -print0 | sort -z \
            | xargs -0 shellcheck --severity=error
          echo "error-severity sweep clean"

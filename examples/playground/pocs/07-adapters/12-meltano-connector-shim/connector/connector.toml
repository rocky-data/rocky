# Manifest for the Meltano connector shim.
# The tap's credentials are declared in rocky.toml (`secrets`), not here:
# the manifest refuses unknown keys.
protocol_version     = 0
name                 = "meltano-shim"
command              = ["./main.py"]
state_schema_version = 1
# Meltano usage tracking is switched off, and the POC tap reads local files.
# A real tap calls its own API hosts: list them here, as a statement of intent.
egress_hosts         = []

# The license of the code in this directory. The tool the shim runs
# has its own license.
license              = "Apache-2.0"
# Rocky supports the shim, the state and the load. A bug in the tool it
# runs goes to that tool's authors.
support_tier         = "community"

[limits]
wall_time_secs = 600

# Snapshot POC — SCD Type 2 with DuckDB
#
# Demonstrates the `rocky snapshot` command tracking historical changes
# to a customers table using the timestamp strategy.
#
# Usage (from this directory):
#   duckdb warehouse.duckdb < seed.sql     # create raw.customers
#   rocky snapshot --dry-run               # print the SQL only
#   rocky snapshot                         # run it
#
# DuckDB names a file database's catalog after the file, so
# `warehouse.duckdb` holds the catalog `warehouse`.

[adapter.local]
type = "duckdb"
path = "warehouse.duckdb"

[pipeline.customers_history]
type = "snapshot"
unique_key = ["customer_id"]
updated_at = "updated_at"
invalidate_hard_deletes = true

[pipeline.customers_history.source]
adapter = "local"
catalog = "warehouse"
schema = "raw"
table = "customers"

[pipeline.customers_history.target]
adapter = "local"
catalog = "warehouse"
schema = "history"
table = "customers_history"

[pipeline.customers_history.target.governance]
auto_create_schemas = true

[state]
backend = "local"

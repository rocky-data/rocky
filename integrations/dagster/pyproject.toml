[project]
name = "dagster-rocky"
version = "1.65.0"
description = "Dagster integration for the Rocky SQL transformation engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Hugo Correia", email = "hello@rocky-data.dev" }]
keywords = ["dagster", "data-engineering", "sql", "transformation", "rocky", "dbt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # The typed result models + RockyClient now live in the standalone rocky-sdk
    # package; RockyResource is a thin Dagster adapter over RockyClient. In-repo
    # dev/CI resolves this from the local path (see [tool.uv.sources]); the
    # published wheel floors on the released SDK. Floored at 0.9.0: dagster_rocky.types
    # re-exports the SDK's generated result models, which as of 0.9.0 include the
    # freeze-marker and schedule/tick output types; an older SDK would be missing
    # them (and also the 0.8.3 `--models` forwarding + retention `env` guard fixes
    # the model-aware resource methods depend on).
    # 0.13.0 is the first release carrying the `rocky product` types. This
    # resource imports ProductVerifyOutput, ProductCompileOutput,
    # ProductApproveOutput and ProductStatusOutput from `.types`, which
    # re-exports `rocky_sdk.types`, which pulls them from the
    # `rocky_sdk.types_generated` barrel at module import. Those names do not
    # exist in 0.12.0, so `import dagster_rocky` raises ImportError against an
    # older SDK — not a TypeError at call time, but a hard failure at import.
    # The 0.12.0 reason still holds underneath it: `dag(models_dir=...)` and
    # `run_model(pipeline=...)` are passed
    # unconditionally. The monorepo path source masks both in dev and CI, so
    # this floor is the only thing protecting the published wheel. Release
    # rocky-sdk 0.13.0 BEFORE any dagster-rocky release carrying this floor.
    # (#1348)
    "rocky-sdk>=0.13.0",
    # Floor matches the version CI actually resolves and tests (uv.lock). The
    # RockyComponent path uses dagster.components.* APIs from preview namespaces,
    # so we advertise a tested floor rather than an older, never-exercised one.
    "dagster>=1.13.8",
    "pydantic>=2.0",
    "pygments>=2.20.0",
]

[project.urls]
Homepage = "https://rocky-data.dev/"
Repository = "https://github.com/rocky-data/rocky"
Documentation = "https://rocky-data.dev/"
"Bug Tracker" = "https://github.com/rocky-data/rocky/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

# Resolve rocky-sdk from the monorepo path for dev + CI so the two packages
# build and test together without a PyPI round-trip. The published dagster-rocky
# wheel ignores this table and uses the `rocky-sdk>=…` version floor above.
[tool.uv.sources]
rocky-sdk = { path = "../../sdk/python", editable = true }

# Register dagster_rocky as a `dg` registry module so `dg list components`,
# `dg scaffold defs dagster_rocky.RockyComponent ...`, and other dg
# commands discover RockyComponent automatically without manual config.
[project.entry-points."dagster_dg_cli.registry_modules"]
dagster_rocky = "dagster_rocky"

[build-system]
# Bounded on purpose — same reason as `sdk/python/pyproject.toml`: hatchling
# 1.32.0 (2026-08-11) emits `Metadata-Version: 2.5`, which the twine 6.1.0 in
# our allow-listed `gh-action-pypi-publish` pin rejects at the publish step.
# `dagster-release` uses the same action, so it would have failed identically.
# Ceiling raised to `<1.33` in #1395 (2026-08-17), which bumped that action
# to a build carrying twine 7.0.0. Still bounded, not open: 1.30.0 and 1.32.0
# both shipped a metadata bump, so the ceiling is what turns the next one into
# a caught failure instead of a broken publish.
requires = ["hatchling>=1.30.1,<1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_rocky"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

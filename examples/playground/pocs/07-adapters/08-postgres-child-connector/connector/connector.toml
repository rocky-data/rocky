# Manifest for the reference Postgres child connector.
# The secrets (the PG* variables) are declared in rocky.toml, not here:
# the manifest refuses unknown keys.
protocol_version     = 0
name                 = "postgres-events"
command              = ["./main.py"]
state_schema_version = 1
# Declared, not enforced. The real egress also includes your Postgres host.
egress_hosts         = ["extensions.duckdb.org"]

# The license of the code in this directory.
license              = "Apache-2.0"
# Maintained by the Rocky project and tested in its CI: `rocky connector
# test` on each pull request, and run.sh against Docker every week. A copy
# of this manifest inherits the tier: change it in your own connector.
support_tier         = "reference"

[limits]
wall_time_secs = 120

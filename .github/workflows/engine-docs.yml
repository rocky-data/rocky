name: engine-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/engine-docs.yml'
  # Build (but never deploy) on docs PRs. Without this, a broken page —
  # an unclosed MDX component, a bad import — only surfaces after merge,
  # when the site is already building from main.
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/engine-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deploys share one `pages` group so they never race each other. PR builds
# get their own per-ref group, so a PR can never cancel an in-flight deploy.
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('docs-pr-{0}', github.ref) }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

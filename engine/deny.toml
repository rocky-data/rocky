# cargo-deny configuration — minimal, scoped to the darling duplicate.
#
# There is no `cargo deny check` in the engine CI today: the weekly security
# audit (`.github/workflows/engine-weekly.yml`) runs `cargo audit` against the
# advisory DB, which does not flag duplicate dependency versions. This file
# exists so a future `cargo deny check` (or a manual audit) passes cleanly.

[bans]
multiple-versions = "deny"
skip = [
    { crate = "darling", reason = "croner (schedule cron parser) pulls a darling major that the wider workspace also uses at a different major — a build-time proc-macro derive helper, disjoint from any runtime code" },
    { crate = "darling_core", reason = "transitive with darling (see above)" },
    { crate = "darling_macro", reason = "transitive with darling (see above)" },
]

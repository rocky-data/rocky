apiVersion: v2
name: rocky
description: Rocky — a typed-program layer above the warehouse. One replica, replaced in place, on a persistent volume.
type: application

# The chart version moves with the chart. `appVersion` names the engine release
# the default image tag pulls.
#
# `appVersion` is 1.75.0: the newest published engine release
# (`gh release list --repo rocky-data/rocky`). `rocky serve --ui` and
# `--allowed-host` arrived in 1.74.0 (rocky #1687). Every default in this
# chart is therefore installable today, the page included.
version: 0.1.1
appVersion: "1.75.0"

home: https://rocky-data.github.io
sources:
  - https://github.com/rocky-data/rocky
maintainers:
  - name: rocky-data
keywords:
  - data
  - warehouse
  - sql

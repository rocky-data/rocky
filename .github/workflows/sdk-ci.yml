name: sdk-ci

on:
  push:
    branches: [main]
    paths:
      - 'sdk/python/**'
      - 'schemas/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/python/**'
      - 'schemas/**'
      - '.github/workflows/sdk-ci.yml'

# Cancel superseded in-progress runs on the same PR — a new push supersedes the
# previous run instead of letting both finish. Scoped to pull_request so a
# fast-follow merge to main never cancels a main-branch validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the repo; restrict the token to the minimum (CodeQL ql-for-actions).
permissions:
  contents: read

defaults:
  run:
    working-directory: sdk/python

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --dev
      - run: uv run python -m pytest -v
      - run: uv run python -m ruff check src/ tests/ examples/
      - run: uv run python -m ruff format --check src/ tests/ examples/

  smoke:
    name: Example smoke (real binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install the rocky binary (latest engine release)
        # The unit tests mock the binary; this job drives the SDK against a real
        # rocky to catch breakage the mocks can't (argv, exit codes, JSON shapes).
        #
        # Resolve the version here, not in install.sh: install.sh asks the
        # GitHub REST API, and shared runners can exhaust its anonymous rate
        # limit, which can fail this job with a 403 (#2684). `git ls-remote`
        # reads tags over git, not the REST API, and needs no token. A tag can
        # exist without release assets (a draft release, or a deleted one), so
        # take the newest tag whose Linux archive answers 200. Only a 404 skips
        # a tag; any other status fails the job, so a transient error never
        # installs an older engine.
        run: |
          tag=""
          for candidate in $(git ls-remote --tags --refs https://github.com/rocky-data/rocky 'engine-v*' \
              | sed 's#.*refs/tags/##' \
              | grep -E '^engine-v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V -r \
              | head -5); do
            status="$(curl -sIL --retry 3 -o /dev/null -w '%{http_code}' \
              "https://github.com/rocky-data/rocky/releases/download/${candidate}/rocky-x86_64-unknown-linux-gnu.tar.gz" || true)"
            if [[ "${status}" == "200" ]]; then
              tag="${candidate}"
              break
            fi
            if [[ "${status}" != "404" ]]; then
              echo "checking ${candidate} returned HTTP ${status:-none}; refusing to fall back to an older engine" >&2
              exit 1
            fi
            echo "skipping ${candidate}: no release assets (HTTP 404)" >&2
          done
          if [[ -z "${tag}" ]]; then
            echo "no engine release with assets among the five newest engine-v* tags" >&2
            exit 1
          fi
          ROCKY_VERSION="${tag}" bash "$GITHUB_WORKSPACE/engine/install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync
      - name: Run the SDK quickstart against a generated playground
        run: uv run python examples/quickstart.py

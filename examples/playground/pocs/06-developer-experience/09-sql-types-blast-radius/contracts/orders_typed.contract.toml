# A typed contract the compiler can only check once it knows the source types.
#
# With no source schemas every column of raw__orders.orders is `Unknown`, so
# the type check cannot run and each typed column below reports I003. When
# the project has data/seed.sql, `rocky compile` types the columns from it
# and the check runs.

[[columns]]
name = "order_id"
type = "Int32"
nullable = true

[[columns]]
name = "amount"
type = "Decimal"
nullable = true

[rules]
required = ["order_id", "amount"]

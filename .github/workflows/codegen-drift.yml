name: codegen-drift

# Verifies that the committed schema files and generated bindings are
# up-to-date with the engine's Rust source. If someone changes a CLI
# output struct without running `just codegen`, this workflow fails the PR.

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'schemas/**'
      - 'docs/public/openapi.json'
      - 'sdk/python/src/rocky_sdk/types_generated/**'
      - 'integrations/dagster/tests/fixtures_generated/**'
      - 'editors/vscode/src/types/generated/**'
      - 'editors/vscode/schemas/rocky-project.schema.json'
      - 'examples/playground/pocs/**'
      - 'scripts/regen_fixtures.sh'
      - 'scripts/_normalize_fixture.py'
      - 'scripts/copy_project_schema.py'
      - 'justfile'
      - '.github/workflows/codegen-drift.yml'
  # No `paths:` filter on pull_request — deliberately. "Check codegen is up
  # to date" is a required merge context. A workflow-level path filter leaves
  # it ABSENT on a PR that does not match, and an absent required check
  # blocks the merge forever (#1563). Instead the `changes` job below detects
  # whether codegen inputs were touched, and the drift job skips itself — a
  # job skipped by an `if:` conditional still reports, and satisfies the
  # required check.
  pull_request:
    branches: [main]

# CI only reads the repo; restrict the token to the minimum (CodeQL ql-for-actions).
permissions:
  contents: read

# Cancel superseded in-progress runs on the same PR — a new push supersedes the
# previous run instead of letting both finish. Scoped to pull_request so a
# fast-follow merge to main never cancels a main-branch validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  # Computes whether this PR touches any codegen input or output. The list
  # below must stay in sync with the `push` trigger's `paths:` above. On push
  # events the trigger's own filter already matched, so the answer is yes.
  #
  # Fail closed: the answer is "false" only when the diff was computed and no
  # relevant path matched. Any error keeps it "true" and the drift check runs.
  changes:
    name: Detect codegen changes
    runs-on: ubuntu-latest
    outputs:
      codegen: ${{ steps.diff.outputs.codegen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit plus both of its parents.
          fetch-depth: 2
      - name: Diff the merge commit against its base parent
        id: diff
        env:
          # Mirrors the push trigger paths above.
          CODEGEN_PATHS_RE: ^(engine/|schemas/|docs/public/openapi\.json$|sdk/python/src/rocky_sdk/types_generated/|integrations/dagster/tests/fixtures_generated/|editors/vscode/src/types/generated/|editors/vscode/schemas/rocky-project\.schema\.json$|examples/playground/pocs/|scripts/regen_fixtures\.sh$|scripts/_normalize_fixture\.py$|scripts/copy_project_schema\.py$|justfile$|\.github/workflows/codegen-drift\.yml$)
        run: |
          set -uo pipefail
          codegen=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if files=$(git diff --name-only HEAD^1 HEAD); then
              if printf '%s\n' "$files" | grep -qE "$CODEGEN_PATHS_RE"; then
                codegen=true
              else
                codegen=false
              fi
            else
              echo "::warning::could not diff the merge commit; running the drift check to fail closed"
            fi
          fi
          echo "codegen=$codegen" >> "$GITHUB_OUTPUT"
          echo "codegen=$codegen"

  drift:
    name: Check codegen is up to date
    needs: changes
    # Skip only on a positive "false" from the detection job. An empty output
    # (the detection job itself failed) runs the check — fail closed.
    if: ${{ !cancelled() && needs.changes.outputs.codegen != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned: an unpinned `stable` let the 1.98.0 release land mid-day
          # (2026-08-20) and turn required checks red with no code change,
          # while cache-busting every Rust job at once. Bump deliberately.
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Bumped when codegen moved from the release profile to dev. A cache
          # entry is immutable per key, so without a new namespace this job
          # would keep restoring the old entry — which holds release artifacts
          # this job no longer builds — and never shrink. The old `v0-rust-drift-*`
          # entries age out by LRU (or `gh cache delete` them once).
          prefix-key: v1-rust-drift-dev
          # Save only from main — see the note in engine-ci.yml. PR runs restore
          # from main's entry and do not mint their own multi-GB duplicate.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cmake (for DuckDB)
        # Present on the current ubuntu-24.04 image, but the `ubuntu-latest`
        # alias is mutable — guard on the binary, not on the image, so this is
        # a no-op today and still self-heals if a future image drops cmake.
        run: command -v cmake >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y cmake; }

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 4G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install duckdb (for fixture regen)
        # Pin to a specific release rather than `curl | sh` the vendor
        # installer — avoids running an unverified remote shell script in CI.
        env:
          DUCKDB_VERSION: "1.1.3"
        run: |
          tmp="$(mktemp -d)"
          url="https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/duckdb.zip" "$url"
          unzip -q -d "$tmp/duckdb" "$tmp/duckdb.zip"
          install -d "$HOME/.duckdb/cli/latest"
          install -m 0755 "$tmp/duckdb/duckdb" "$HOME/.duckdb/cli/latest/duckdb"
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: uv sync (sdk)
        # `just codegen` runs datamodel-codegen inside sdk/python to regenerate
        # the Pydantic models, so the SDK env must be present.
        run: uv sync --dev
        working-directory: sdk/python

      - name: npm install (vscode)
        run: npm ci
        working-directory: editors/vscode

      # Fast pre-check: cargo test for the export-schemas registry catches
      # the most common drift modes (missing JsonSchema derive, duplicate
      # registration, schema file count mismatch) with cleaner error
      # messages than the file-diff at the end. Runs before any codegen
      # so CI fails fast on registry mistakes.
      - name: cargo test export-schemas registry
        run: cargo test -p rocky-cli --lib commands::export_schemas
        working-directory: engine

      # `just codegen-rust` builds the rocky binary with the DEV profile and
      # `just regen-fixtures` below resolves the same binary — one compile for
      # both steps. Dev is deliberate: codegen output is serialized schemars
      # JSON, and a two-profile byte-diff (schemas + openapi + fixtures)
      # confirmed release and debug emit identical bytes, for a fraction of
      # the build time. See the justfile note on `codegen-rust`.
      - name: Run full codegen
        run: just codegen

      - name: Regenerate fixtures
        run: just regen-fixtures

      - name: Fail if anything drifted
        run: |
          untracked=$(git ls-files --others --exclude-standard -- schemas/ \
                                    sdk/python/src/rocky_sdk/types_generated/ \
                                    integrations/dagster/tests/fixtures_generated/ \
                                    editors/vscode/src/types/generated/)
          if [ -n "$untracked" ]; then
            echo "❌ Codegen produced files that are not committed:"
            echo "$untracked"
            echo "Run \`just codegen\` and \`just regen-fixtures\` locally and commit the result."
            exit 1
          fi
          if ! git diff --exit-code schemas/ \
                                    docs/public/openapi.json \
                                    sdk/python/src/rocky_sdk/types_generated/ \
                                    integrations/dagster/tests/fixtures_generated/ \
                                    editors/vscode/src/types/generated/ \
                                    editors/vscode/schemas/rocky-project.schema.json; then
            echo ""
            echo "❌ Codegen output or generated fixtures drifted from the committed files."
            echo "Run \`just codegen\` and \`just regen-fixtures\` locally and commit the result."
            exit 1
          fi
          echo "✓ Codegen output and generated fixtures match committed files."

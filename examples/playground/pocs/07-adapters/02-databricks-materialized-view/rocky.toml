[adapter.databricks_prod]
type = "databricks"
host = "${DATABRICKS_HOST}"
http_path = "${DATABRICKS_HTTP_PATH}"
token = "${DATABRICKS_TOKEN}"

# Discovery adapter — Databricks is data-only, so a manual discovery
# adapter lists the source tables this POC reads. Rocky makes no
# discovery call for it; it reports exactly these schemas.
[adapter.local_discovery]
type = "manual"
kind = "discovery"

[[adapter.local_discovery.schemas]]
name = "raw__orders"
tables = ["orders"]

[pipeline.poc]
strategy = "full_refresh"

[pipeline.poc.source]
adapter = "databricks_prod"
catalog = "main"

[pipeline.poc.source.discovery]
adapter = "local_discovery"

[pipeline.poc.source.schema_pattern]
prefix = "raw__"
separator = "__"
components = ["source"]

[pipeline.poc.target]
adapter = "databricks_prod"
catalog_template = "rocky_demo"
schema_template = "marts"

[pipeline.poc.target.governance]
auto_create_catalogs = true
auto_create_schemas = true

name: vscode-ci

on:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - 'schemas/**'
      - '.github/workflows/vscode-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - 'schemas/**'
      - '.github/workflows/vscode-ci.yml'

# CI only reads the repo; restrict the token to the minimum (CodeQL ql-for-actions).
permissions:
  contents: read

# Cancel superseded in-progress runs on the same PR — a new push supersedes the
# previous run instead of letting both finish. Scoped to pull_request so a
# fast-follow merge to main never cancels a main-branch validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: editors/vscode

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Run unit tests (vitest)
        # BEFORE the integration harness, and deliberately.
        #
        # `npm test` is the VS Code integration harness; `npm run test:unit` is
        # vitest, and nothing ran it — so all 318 unit tests were inert,
        # including the guard on the hand-maintained generated barrel
        # (`src/types/generated/index.ts`, which `just codegen` never writes).
        # Four generated output types sat unreachable on main while
        # `codegen-drift` stayed green, because both sides it compares agreed
        # (#1917, exports fixed by #1916).
        #
        # It runs first because it is the cheap half: ~3s, no display, no xvfb.
        # A barrel regression should fail before the runner spends minutes
        # booting VS Code.
        run: npm run test:unit
      - name: Run tests
        run: xvfb-run -a npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint

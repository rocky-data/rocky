# Manifest for the dlt connector shim.
# The tool's credentials would be declared in rocky.toml (`secrets`), not here:
# the manifest refuses unknown keys.
protocol_version     = 0
name                 = "dlt-shim"
command              = ["./launch.sh"]
state_schema_version = 1
# The shim itself calls no host (dlt telemetry is switched off). Your dlt
# source may: list its API hosts here, as a statement of intent.
egress_hosts         = []

# The license of the code in this directory. The tool the shim runs
# has its own license.
license              = "Apache-2.0"
# Rocky supports the shim, the state and the load. A bug in the tool it
# runs goes to that tool's authors.
support_tier         = "community"

[limits]
wall_time_secs = 300

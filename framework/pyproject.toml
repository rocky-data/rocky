[project]
name = "rocky-fulfillment"
version = "0.1.0"
description = "Spec-driven fulfillment runtime for the Rocky SQL transformation engine"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Hugo Correia", email = "hello@rocky-data.dev" }]
dependencies = [
    # The typed client lives in the standalone rocky-sdk package; the trusted
    # runner drives the `rocky` CLI exclusively through it. In-repo dev/CI
    # resolves this from the local path (see [tool.uv.sources]); a published
    # wheel would floor on the released SDK from PyPI. Nothing publishes in
    # Phase 1 — the floor tracks the in-tree SDK version this package is
    # developed against.
    "rocky-sdk>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

# Resolve rocky-sdk from the monorepo path for dev + CI so the two packages
# build and test together without a PyPI round-trip. A published wheel ignores
# this table and uses the `rocky-sdk>=…` version floor above.
[tool.uv.sources]
rocky-sdk = { path = "../sdk/python", editable = true }

[build-system]
# Bounded on purpose — same reason as `sdk/python/pyproject.toml`, which
# carries the full story: hatchling 1.30.0 and 1.32.0 both shipped a
# Metadata-Version bump, and the 1.32.0 one broke the pinned PyPI publish
# action at the publish step (#1395). The ceiling turns the next such bump
# into a caught failure instead of a broken publish. Keep the bound in
# lockstep with the sibling Python subprojects.
requires = ["hatchling>=1.30.1,<1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocky_fulfillment"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

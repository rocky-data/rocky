[package]
name = "rocky-snowflake"
version = "1.73.0"
description = "Snowflake warehouse adapter for Rocky"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rocky-core = { path = "../rocky-core" }
rocky-ir = { path = "../rocky-ir" }
rocky-sql = { path = "../rocky-sql" }
rocky-adapter-sdk = { path = "../rocky-adapter-sdk" }
rocky-observe = { path = "../rocky-observe" }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

[features]
test-support = []

[[test]]
name = "wiremock_tests"
required-features = ["test-support"]

[dev-dependencies]
# `test-support` exposes `MetadataColumn::new_unchecked`, which this crate's
# tests use to build the hostile metadata columns `select_clause` must refuse.
# Dev-only: resolver v2 keeps the feature out of normal builds.
rocky-ir = { path = "../rocky-ir", features = ["test-support"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"

[lints]
workspace = true

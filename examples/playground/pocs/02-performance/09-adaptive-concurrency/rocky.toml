# Adaptive concurrency — AIMD-based dynamic parallelism

[adapter]
type = "duckdb"
path = "poc.duckdb"

[pipeline.poc]
strategy = "full_refresh"

[pipeline.poc.source.schema_pattern]
prefix = "raw__"
separator = "__"
components = ["source"]

[pipeline.poc.target]
catalog_template = "poc"
schema_template = "staging__{source}"

[pipeline.poc.target.governance]
auto_create_schemas = true

# Fixed concurrency: an integer is a hard limit and turns the AIMD throttle
# off. Use concurrency = "adaptive" (the default) for AIMD throttling.
[pipeline.poc.execution]
concurrency = 16
fail_fast = false
error_rate_abort_pct = 50
table_retries = 2

[package]
name = "rocky-core-compiletest"
version = "0.0.0"
description = "Out-of-crate compile-fail guards for rocky-core: the #[must_use] authority boundary and the pub(crate) manifest demotion"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# `rocky-core` is the crate whose public API the compile-fail cases exercise.
# `trybuild` copies these `[dependencies]` into the case project it builds, so
# the cases can `use rocky_core::...`. Deliberately NOT depending on
# `rocky-duckdb` (a rocky-core *dev*-dependency): that is exactly the heavyweight
# build this crate exists to keep out of `target/tests/trybuild/`.
[dependencies]
rocky-core = { path = "../rocky-core" }
# Needed only by `compile_fail/missing_literal_escape.rs`, which has to spell
# every required `SqlDialect` method to prove that exactly one of them is what
# fails. Both are already in rocky-core's own graph and cost nothing extra;
# the heavyweight dependency this crate exists to exclude is `rocky-duckdb`.
rocky-ir = { path = "../rocky-ir" }
chrono = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }

[lints]
workspace = true

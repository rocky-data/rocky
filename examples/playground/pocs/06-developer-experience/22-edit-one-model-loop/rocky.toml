# 22-edit-one-model-loop — edit one model, rebuild only it and its downstream.

[adapter]
type = "duckdb"
path = "poc.duckdb"

[pipeline.demo]
type = "transformation"
models = "models/**"

[pipeline.demo.target.governance]
auto_create_schemas = true

[run]
# Turn the skip gate on for every `rocky run` in this project.
skip_unchanged = true
# The two raw tables have no tracked timestamp column. Use the weaker
# COUNT(*) signal so Rocky can prove the raw data did not change.
skip_rowcount_fallback = true

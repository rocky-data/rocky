name: engine-wasm-release

# Build rocky-wasm and publish to npm.
# Triggered by engine-wasm-v* tags (independent of CLI binary releases).
#
# The GitHub Release is created as a draft and published by the last step
# only, after the npm publish and the asset upload both succeed. A failed
# build or publish therefore leaves a draft, which the public release list
# omits, not an empty or partial public release. In rocky-data/rocky a
# missing NPM_TOKEN fails the run; a fork without the secret gets a soft
# no-op instead.

on:
  push:
    tags: ["engine-wasm-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: engine

jobs:
  ensure-release:
    name: Ensure GitHub Release exists
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # `gh release view` finds a draft by its pending tag too, so a draft
          # made by scripts/release.sh is seen here. Any other failure falls
          # through to `create`, which fails on its own if the release exists.
          if is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG already exists and is published. Refusing to publish again on top of a live release. Convert it back to a draft (gh release edit $TAG --repo $GITHUB_REPOSITORY --draft) or delete it, then re-run."
              exit 1
            fi
            echo "Release $TAG already exists as a draft; this run will publish it"
          else
            echo "Creating draft release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --draft \
              --latest=false \
              --title "$TAG"
          fi

  build-and-publish:
    name: Build WASM and publish to npm
    needs: ensure-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned: an unpinned `stable` let the 1.98.0 release land mid-day
          # (2026-08-20) and turn required checks red with no code change,
          # while cache-busting every Rust job at once. Bump deliberately.
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          # Restore only. This workflow runs on a TAG ref, and GitHub scopes
          # caches so an entry created for one tag is never visible to the
          # next one — saving here spends multi-GB of the repo's 10 GB budget
          # on an entry only a re-run of this same tag could ever read, while
          # evicting the main-branch caches that every PR restores from.
          save-if: false
          key: wasm

      # Set up Node with the npm registry so `npm publish` picks up
      # NODE_AUTH_TOKEN automatically (no hand-rolled .npmrc).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Prebuilt binary — avoids ~40s of `cargo install wasm-pack --locked`
      # per run and skips a transitive compilation that occasionally trips
      # MSRV / yanked-crate failures.
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.13.1'

      - name: Build WASM (web target)
        run: wasm-pack build crates/rocky-wasm --target web

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#engine-wasm-v}"
          # Accept only SemVer-ish tokens so the value is safe to interpolate
          # into package.json below.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish: tag '${GITHUB_REF_NAME}' did not yield a SemVer version (got '${VERSION}')" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Write package.json with tag version
        working-directory: engine/crates/rocky-wasm/pkg
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Use `jq` rather than string interpolation so the version is quoted
          # as a JSON value and never able to break out of the template.
          jq -n --arg version "$PKG_VERSION" '{
            name: "@rocky-data/compiler",
            version: $version,
            description: "WASM bindings for Rockys Rust compiler pipeline — SQL lineage, Rocky DSL parsing, and identifier validation",
            main: "rocky_wasm.js",
            types: "rocky_wasm.d.ts",
            files: [
              "rocky_wasm_bg.wasm",
              "rocky_wasm.js",
              "rocky_wasm.d.ts",
              "rocky_wasm_bg.wasm.d.ts"
            ],
            repository: {
              type: "git",
              url: "https://github.com/rocky-data/rocky",
              directory: "engine/crates/rocky-wasm"
            },
            keywords: ["wasm", "sql", "lineage", "transformation", "rocky"],
            license: "Apache-2.0",
            publishConfig: {
              access: "public"
            }
          }' > package.json

      - name: Archive WASM package
        run: tar czf rocky-wasm.tar.gz -C crates/rocky-wasm/pkg .

      # Upload with `gh` rather than a release action: the pinned
      # softprops/action-gh-release finalizes an existing draft after it
      # uploads (it clears `draft` unless `draft: true` is passed), which
      # would make the release public before the npm publish below has run.
      # `gh release upload` touches assets only. Same mechanism the engine,
      # sdk, dagster and vscode workflows use.
      - name: Attach to GitHub Release
        working-directory: engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" rocky-wasm.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # Guard inline so the step never parses `secrets.*` in a step-level
      # `if:` (disallowed on public repos) and never depends on step-env
      # visibility in the same step's `if:` (which is unreliable).
      - name: Publish to npm
        working-directory: engine/crates/rocky-wasm/pkg
        env:
          # `actions/setup-node` already wrote a registry-scoped .npmrc that
          # reads $NODE_AUTH_TOKEN from the environment at publish time, so
          # the token never hits disk.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            # On a fork the secret is absent by design. On this repository it
            # means a missing or rotated secret, and a green run that never
            # reached npm would hide exactly that.
            if [ "${REPO}" = "rocky-data/rocky" ]; then
              echo "::error::NPM_TOKEN is not set. Refusing to report a successful release that never published to npm. Set the secret and re-run; the GitHub Release stays a draft until this step succeeds."
              exit 1
            fi
            echo "NPM_TOKEN secret not set — skipping npm publish (expected on forks)"
            exit 0
          fi
          npm publish

      # Last on purpose: a failure in any step above leaves the release a
      # draft. `--latest=false` again here, because GitHub's API defaults
      # `make_latest` to true when a draft is published, and the engine
      # release owns the repo's "Latest" badge.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=false
          echo "Published ${GITHUB_REF_NAME}"

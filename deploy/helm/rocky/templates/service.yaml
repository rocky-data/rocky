{{- include "rocky.guards" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rocky.fullname" . }}
  labels:
    {{- include "rocky.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rocky.selectorLabels" . | nindent 4 }}

[package]
name = "rocky-observe"
version = "1.70.1"
description = "Observability for Rocky (structured logging, metrics, events)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
otel = [
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-otlp",
    "tracing-opentelemetry",
]
# Exposes the in-memory metrics harness used to assert scheduler instrument
# emission. Test-only: never enabled for a release binary.
test-support = ["otel", "opentelemetry_sdk/testing"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = ["rt-tokio", "metrics", "trace"] }
opentelemetry-otlp = { workspace = true, optional = true, features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"

[lints]
workspace = true
